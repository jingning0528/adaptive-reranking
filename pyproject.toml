[project]
name = "adaptive-reranking"
version = "1.0.0"
description = "Adaptive candidate and text budgets for efficient neural reranking"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "beir==2.2.0",
    "joblib>=1.4",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "sentence-transformers>=5,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.8"]

[project.urls]
Repository = "https://github.com/jingning0528/adaptive-reranking"

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["adaptive_reranking*"]

[tool.ruff]
line-length = 119

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
